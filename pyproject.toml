[project]
name = "cmn-c1-101"
version = "1.0.0"
description = "CMN-C1-101 Agent"
requires-python = ">=3.11"
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "pytest-asyncio==0.23.6",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["src/examples/"]

[[tool.mypy.overrides]]
# agenticstar-agentcore ships no py.typed marker, so framework.*/shared.* resolve to Any (SDK packaging gap, not fixable here).
module = ["framework.*", "shared.*", "yaml", "sniffio", "sniffio.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Subclassing the SDK's Any-typed bases (FunctionNode, AgentBaseGraph, GraphNode, AgentState) is the sanctioned pattern.
module = "src.*"
disallow_subclassing_any = false
